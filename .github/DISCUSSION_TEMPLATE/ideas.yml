labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before posting, search existing ideas. If someone already suggested it, add your 👍 and tell us your use case in a comment.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the goal, not only the feature. This helps us find the best fix.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today? (optional)
